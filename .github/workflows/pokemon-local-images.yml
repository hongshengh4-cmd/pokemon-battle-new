name: 下载宝可梦图片并部署网站

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokemon-local-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装图片校验工具
        run: python -m pip install 'Pillow>=11,<13'
      - name: 下载并校验全部图片
        shell: bash
        run: |
          python - <<'PYTHON'
          import concurrent.futures
          import io
          import json
          import re
          import threading
          import time
          import urllib.request
          from pathlib import Path
          from PIL import Image
          
          root = Path('.')
          bridge = (root / 'st-bridge/bridge.js').read_text(encoding='utf-8')
          if not (root / 'st-bridge/sprite-recovery.js').is_file():
              raise SystemExit('请先上传 v1.3.30 运行文件（50个文件），再运行工作流。')
          marker = 'const PERSISTENT_SPECIES='
          if marker not in bridge:
              raise SystemExit('没有找到支持的宝可梦名单，停止，不修改仓库。')
          policy, _ = json.JSONDecoder().raw_decode(bridge.split(marker, 1)[1])
          if len(policy) != 1200:
              raise SystemExit(f'名单数量应为1200，实际为{len(policy)}；停止以免下载错误资源。')
          jobs = {}
          for info in policy.values():
              for side in ('front', 'back'):
                  for shiny in (False, True):
                      url = info[side]
                      if shiny:
                          for normal, alternate in [('ani', 'ani-shiny'), ('ani-back', 'ani-back-shiny'), ('gen5', 'gen5-shiny'), ('gen5-back', 'gen5-back-shiny')]:
                              url = url.replace('/' + normal + '/', '/' + alternate + '/')
                      prefix = 'https://play.pokemonshowdown.com/sprites/'
                      if not url.startswith(prefix):
                          raise SystemExit('发现非预期图片域名，停止。')
                      relative = url[len(prefix):]
                      if not re.fullmatch(r'(ani|ani-back|ani-shiny|ani-back-shiny|gen5|gen5-back|gen5-shiny|gen5-back-shiny)/[a-z0-9-]+\.(gif|png)', relative):
                          raise SystemExit('发现非预期文件路径，停止。')
                      jobs[url] = relative
          if len(jobs) != 4800:
              raise SystemExit(f'应有4800个图片地址，实际为{len(jobs)}。')
          lock = threading.Lock()
          done = 0
          failures = []
          
          def task(job):
              global done
              url, relative = job
              target = root / 'assets/pokemon' / relative
              static = root / 'assets/pokemon/static' / re.sub(r'\.(gif|png)$', '.png', relative)
              error = ''
              for attempt in range(4):
                  try:
                      if target.is_file():
                          blob = target.read_bytes()
                      else:
                          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://play.pokemonshowdown.com/'})
                          with urllib.request.urlopen(req, timeout=35) as response:
                              blob = response.read()
                      with Image.open(io.BytesIO(blob)) as image:
                          image.verify()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(blob)
                      if not static.is_file():
                          static.parent.mkdir(parents=True, exist_ok=True)
                          with Image.open(io.BytesIO(blob)) as image:
                              image.seek(0)
                              image.convert('RGBA').save(static, optimize=True)
                      with lock:
                          done += 1
                          if done % 100 == 0:
                              print(f'已完成 {done}/4800', flush=True)
                      return
                  except Exception as exc:
                      error = str(exc)
                      if target.is_file():
                          try:
                              with Image.open(target) as image:
                                  image.verify()
                          except Exception:
                              target.unlink(missing_ok=True)
                      time.sleep(1 + attempt * 2)
              with lock:
                  failures.append({'url': url, 'error': error})
          
          print('开始：普通/异色，正面/背面，共4800张原图及4800张静态备份。', flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(task, jobs.items()))
          if failures:
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              raise SystemExit(f'{len(failures)}个资源失败；不提交、不部署。可以稍后重新运行。')
          print('全部成功：4800张原图 + 4800张静态备份。', flush=True)
          PYTHON
      - name: 把图片保存进仓库
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pokemon
          if ! git diff --cached --quiet; then
            git commit -m "Add local Pokemon sprites and static fallbacks"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo '图片已在仓库中，无需重复提交。'
          fi
      - name: 整理网站部署目录
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          cp -a src st-bridge assets _site/
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站部署内容
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原版布局 + Showdown 动画 预览</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef1f5}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.bar b{margin-right:8px;color:#403b4a}
.bar button{border:2px solid #e5e7eb;background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;color:#403b4a}
.bar button.on{border-color:#fa709a;background:#fff0f5}
iframe{width:100%;height:calc(100% - 52px);border:0;display:block}
</style>
<div class="bar"><b>场景</b>
<button data-u="host.html">道馆 3v3（原测试）</button>
<button data-u="ps-host.html?s=mega">超级进化</button>
<button data-u="ps-host.html?s=z">Z 招式</button>
<button data-u="ps-host.html?s=gmax">超极巨化</button>
<button data-u="ps-host.html?s=tera">太晶化</button>
<button data-u="ps-host.html?s=faint">倒下/换上</button>
<button data-u="ps-host.html?s=doubles">双打</button>
</div>
<iframe id="v"></iframe>
<script>
const v=document.getElementById('v'),bs=[...document.querySelectorAll('.bar button')];
const go=b=>{bs.forEach(x=>x.classList.toggle('on',x===b));v.src=b.dataset.u+(b.dataset.u.includes('?')?'&':'?')+'t='+Date.now();};
bs.forEach(b=>b.onclick=()=>go(b));go(bs[1]);
</script>

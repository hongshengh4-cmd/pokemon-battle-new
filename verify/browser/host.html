<!doctype html><meta charset="utf-8"><title>PKM embed host harness</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}</style>
<iframe id="f" src="../../index.html?embed=1&v=test"></iframe>
<script>
// Minimal stand-in for st-bridge: same message protocol, a 6-member party, Brock 3v3 with genderless-unknown trainer input.
window.__msgs=[];
const cfg={rules:{teamSize:3,playerLimit:3,enemyLimit:3,tag:'3v3',label:'3v3',rule:'道馆 3v3',battleMode:'single',typeLabel:'道馆战',opponent:'小刚',sideLabel:'小刚'},
 encounter:{type:'trainer'},difficulty:'easy',
 p1:{entrants:[{name:'host-player',party:[
  {species:'Pidgey',level:14,moves:['tackle','gust'],hostSlot:0,gender:'M'},
  {species:'Bellsprout',level:14,moves:['vinewhip'],hostSlot:1,gender:'F'},
  {species:'Geodude',level:16,moves:['rollout','defensecurl','tackle'],hostSlot:2,gender:'M'},
  {species:'Jigglypuff',level:14,moves:['pound'],hostSlot:3,gender:'F'},
  {species:'Magnemite',level:14,moves:['thundershock'],hostSlot:4,gender:'N'},
  {species:'Snorlax',level:14,moves:['tackle'],hostSlot:5}]}]},
 p2:{entrants:[{name:'host-enemy',party:[
  {species:'Onix',level:40,moves:['splash']},{species:'Geodude',level:12,moves:['tackle']},{species:'Vulpix',level:12,moves:['ember']}]}]},
 host:{tag:'harness-1',identityKey:'gym-brock-test',balls:{pokeball:3},battleItems:{},intro:'测试'}};
addEventListener('message',e=>{const d=e.data||{};__msgs.push(d);
 if(d.type==='PKM_BATTLE_READY'&&!window.__sent){window.__sent=true;document.getElementById('f').contentWindow.postMessage({type:'PKM_BATTLE_CONFIG',payload:cfg},'*');}});
</script>

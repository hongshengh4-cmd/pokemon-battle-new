<!doctype html><meta charset="utf-8"><title>双打测试宿主</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}</style>
<iframe id="f" src="../../index.html?embed=1&v=test"></iframe>
<script>
window.__msgs=[];
const q=new URLSearchParams(location.search);
const n=Number(q.get('n')||3);
const P=[{species:'Machamp',level:40,moves:['crosschop','rockslide'],hostSlot:0,gender:'M'},
  {species:'Gengar',level:40,moves:['shadowball','sludgebomb'],hostSlot:1,gender:'M'},
  {species:'Pikachu',level:30,moves:['thunderbolt','quickattack'],hostSlot:2,gender:'M'},
  {species:'Lapras',level:35,moves:['surf','icebeam'],hostSlot:3,gender:'F'}];
const E=[{species:'Rattata',level:12,moves:['tackle']},{species:'Pidgey',level:28,moves:['gust']},{species:'Spearow',level:28,moves:['peck']},{species:'Ekans',level:28,moves:['wrap']}];
if(q.get('mega')){Object.assign(P[0],{species:'Gengar',moves:['shadowball','sludgebomb'],item:'gengarite',mechanic:'mega',megaForm:'gengarmega'});Object.assign(P[1],{species:'Scizor',moves:['bulletpunch','xscissor'],item:'scizorite',mechanic:'mega',megaForm:'scizormega'});}
if(q.get('hard')){const t=P.slice();P.splice(0,4,...E.map((e,i)=>({...e,level:8,hostSlot:i})));E.splice(0,4,...t.map(({hostSlot,...x})=>x));}
const cfg={rules:{teamSize:n,playerLimit:n,enemyLimit:n,tag:n+'v'+n,label:n+'v'+n,rule:n+'v'+n+'；双打：双方各2只同时出场，双方分别为每只出战宝可梦选择行动。',battleMode:q.get('single')?'single':'double',typeLabel:'训练家对战',opponent:'测试训练家',sideLabel:'对手',...(q.get('ffl')?{firstFaintLoses:true,tag:'2v2 · 双打接力',opponent:'琉丽'}:{})},
 encounter:{type:'trainer'},difficulty:q.get('tier')?'hard':'easy',aiContext:q.get('tier')?{type:'gym',opponent:'测试训练家',ai:{tier:q.get('tier')}}:undefined,ai:q.get('tier')?{tier:q.get('tier')}:undefined,
 p1:{entrants:[{name:'host-player',party:P.slice(0,n)}]},
 p2:{entrants:[{name:'host-enemy',party:E.slice(0,n)}]},
 host:{tag:'dbl-1',identityKey:'dbl-test-'+n,balls:{pokeball:3},battleItems:{},intro:'双打测试'}};
addEventListener('message',e=>{const d=e.data||{};__msgs.push(d);
 if(d.type==='PKM_BATTLE_READY'&&!window.__sent){window.__sent=true;document.getElementById('f').contentWindow.postMessage({type:'PKM_BATTLE_CONFIG',payload:cfg},'*');}});
</script>

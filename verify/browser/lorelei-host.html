<script>
// Minimal stand-in for st-bridge: same message protocol, a 6-member party, Brock 3v3 with genderless-unknown trainer input.
window.__msgs=[];
const cfg={rules:{teamSize:6,playerLimit:6,enemyLimit:6,tag:'3v3',label:'3v3',rule:'道馆 3v3',battleMode:'single',typeLabel:'道馆战',opponent:'小刚',sideLabel:'小刚'},
 encounter:{type:'trainer'},difficulty:'easy',
 p1:{entrants:[{name:'host-player',party:[
  {species:'波波',level:14,ability:'锐利目光（隐藏特性）',nature:'固執',item:'乱写道具',moves:['撞擊','起風'],hostSlot:0,gender:'M'},
  {species:'喇叭芽',level:14,ability:'乱写特性',nature:'乱写性格',moves:['Vine Whip'],hostSlot:1,gender:'F'},
  {species:'Geodude',level:16,moves:['rollout','defensecurl','tackle'],hostSlot:2,gender:'M'},
  {species:'Jigglypuff',level:14,moves:['pound'],hostSlot:3,gender:'F'},
  {species:'Magnemite',level:14,moves:['thundershock'],hostSlot:4,gender:'N'},
  {species:'Snorlax',level:14,moves:['tackle'],hostSlot:5}]}]},

 {species:'呆壳兽',level:93,ability:'再生力',item:'凸凸头盔',moves:['热水','精神强念','铁壁','偷懒']},
 {species:'迷唇姐',level:94,ability:'干燥皮肤',item:'气势披带',moves:['恶魔之吻','暴风雪','精神冲击','诡计']},
 {species:'象牙猪',level:94,ability:'厚脂肪',item:'生命宝珠',moves:['地震','冰柱坠击','冰砾','蛮力']},

 if(d.type==='PKM_BATTLE_READY'&&!window.__sent){window.__sent=true;document.getElementById('f').contentWindow.postMessage({type:'PKM_BATTLE_CONFIG',payload:cfg},'*');}});
</script>
